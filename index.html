<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cwelownia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0a'/><text x='50' y='72' font-size='70' font-family='Arial Black' font-weight='900' text-anchor='middle' fill='%23e8e8e8'>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1e1e1e;
  --border: #2e2e2e;
  --accent: #e8e8e8;
  --accent2: #b0b0b0;
  --text: #f0f0f0;
  --muted: #606060;
  --danger: #ff4444;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
}

/* ── LOGIN ── */
#login {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

.logo { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 4px; }
.logo span { color: var(--accent2); }
.logo-sub { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-bottom: 56px; letter-spacing: 0.1em; text-transform: uppercase; }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 620px; }
@media(max-width: 560px) { .cards { grid-template-columns: 1fr; } }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 26px 22px;
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.card-tag { font-family: 'Space Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent2); }
.card-title { font-size: 1.2rem; font-weight: 800; }
.card-desc { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--muted); line-height: 1.6; }

.flabel { font-family: 'Space Mono', monospace; font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
.fgroup { display: flex; flex-direction: column; }

.finput {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 13px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 0.78rem;
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}
.finput:focus { border-color: var(--accent2); }
.finput::placeholder { color: var(--muted); }

.btn {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 7px;
  padding: 11px 18px;
  font-weight: 800;
  font-family: 'Syne', sans-serif;
  font-size: 0.88rem;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  width: 100%;
  margin-top: 4px;
}
.btn:hover { opacity: 0.85; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

.errmsg { font-family: 'Space Mono', monospace; font-size: 0.67rem; color: var(--danger); min-height: 16px; }

/* ── ROOM ── */
#room { display: none; flex-direction: column; height: 100vh; }

header {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  gap: 10px;
  position: sticky; top: 0; z-index: 100;
  flex-wrap: wrap;
}

.hlogo { font-size: 1.1rem; font-weight: 800; flex-shrink: 0; }
.hlogo span { color: var(--accent2); }

.dot { width: 6px; height: 6px; background: var(--accent2); border-radius: 50%; animation: pulse 2s infinite; flex-shrink: 0; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.users-row { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }
.utag { font-family: 'Space Mono', monospace; font-size: 0.6rem; padding: 2px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; color: var(--muted); white-space: nowrap; }
.utag.is-host { border-color: rgba(232,232,232,0.4); color: var(--accent); }

.hbtns { display: flex; gap: 7px; margin-left: auto; flex-shrink: 0; }
.hbtn { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 5px 11px; font-family: 'Space Mono', monospace; font-size: 0.6rem; cursor: pointer; transition: all 0.15s; color: var(--muted); white-space: nowrap; }
.hbtn:hover { border-color: var(--accent2); color: var(--accent2); }
.hbtn.active { border-color: var(--danger); color: var(--danger); }
.hbtn.leave:hover { border-color: var(--danger); color: var(--danger); }

/* ── MAIN LAYOUT ── */
.main { display: grid; grid-template-columns: 1fr 300px; flex: 1; overflow: hidden; }
@media(max-width: 768px) { .main { grid-template-columns: 1fr; grid-template-rows: 240px 1fr; overflow: auto; } }

/* ── PLAYER ── */
.player-col { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; min-height: 0; }
@media(max-width: 768px) { .player-col { border-right: none; border-bottom: 1px solid var(--border); } }

.player-wrap { flex: 1; background: #000; position: relative; overflow: hidden; min-height: 0; }

.placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); }
.ph-icon { font-size: 3rem; opacity: 0.15; margin-bottom: 10px; }
.ph-txt { font-family: 'Space Mono', monospace; font-size: 0.75rem; text-align: center; line-height: 1.7; opacity: 0.5; }

#yt-player { position: absolute; inset: 0; width: 100%; height: 100%; }
#native-wrap { position: absolute; inset: 0; display: none; background: #000; align-items: center; justify-content: center; }
#native-wrap video { max-width: 100%; max-height: 100%; }

/* custom controls overlay */
#ctrl-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  padding: 28px 14px 12px;
  display: none; flex-direction: column; gap: 7px;
  z-index: 10;
}
#ctrl-overlay.show { display: flex; }
.player-wrap:hover #ctrl-overlay { opacity: 1; }

.prog-row { display: flex; align-items: center; gap: 8px; }
.prog-bg {
  flex: 1; height: 4px; background: rgba(255,255,255,0.2);
  border-radius: 2px; cursor: pointer; position: relative; transition: height 0.15s;
}
.prog-bg:hover { height: 6px; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 2px; pointer-events: none; }
.prog-thumb {
  position: absolute; right: 0; top: 50%; transform: translate(50%,-50%);
  width: 11px; height: 11px; background: var(--accent); border-radius: 50%;
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
}
.prog-bg:hover .prog-thumb { opacity: 1; }
.ttime { font-family: 'Space Mono', monospace; font-size: 0.6rem; color: rgba(255,255,255,0.75); white-space: nowrap; min-width: 74px; text-align: right; }

.ctrl-row { display: flex; align-items: center; gap: 5px; }
.cb {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 5px; padding: 5px 10px; color: #fff;
  font-family: 'Space Mono', monospace; font-size: 0.67rem;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.cb:hover { background: rgba(232,232,232,0.18); border-color: var(--accent); color: var(--accent); }
.cb.play-btn { padding: 5px 14px; font-size: 0.9rem; }
.vol-wrap { display: flex; align-items: center; gap: 5px; margin-left: 2px; }
.vol { -webkit-appearance: none; appearance: none; width: 68px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; cursor: pointer; }
.vol::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); cursor: pointer; }
.spacer { flex: 1; }
.fs-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 5px; padding: 5px 9px; color: #fff; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
.fs-btn:hover { border-color: var(--accent); color: var(--accent); }

/* pause overlay */
#pause-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; z-index: 7; pointer-events: none; flex-direction: column; gap: 8px; }
#pause-overlay.on { display: flex; }
.po-icon { font-size: 3.5rem; opacity: 0.85; }
.po-txt { font-family: 'Space Mono', monospace; font-size: 0.75rem; color: rgba(255,255,255,0.65); letter-spacing: 0.12em; }


/* ── SIDEBAR ── */
.sidebar { display: flex; flex-direction: column; background: var(--surface); overflow: hidden; min-height: 0; }

.add-box { padding: 15px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.slbl { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent2); font-family: 'Space Mono', monospace; margin-bottom: 9px; }
.add-row { display: flex; gap: 7px; }
.urlinput { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 11px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 0.7rem; outline: none; transition: border-color 0.2s; min-width: 0; }
.urlinput:focus { border-color: var(--accent2); }
.urlinput::placeholder { color: var(--muted); }
.addbtn { background: var(--accent); color: #000; border: none; border-radius: 6px; padding: 8px 13px; font-weight: 800; font-family: 'Syne', sans-serif; font-size: 0.8rem; cursor: pointer; transition: opacity 0.15s, transform 0.1s; flex-shrink: 0; }
.addbtn:hover { opacity: 0.85; } .addbtn:active { transform: scale(0.96); }
.sup-tags { margin-top: 8px; display: flex; gap: 4px; }
.stag { font-family: 'Space Mono', monospace; font-size: 0.56rem; padding: 2px 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; color: var(--muted); }

.pl-wrap { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; }
.pl-wrap::-webkit-scrollbar { width: 3px; }
.pl-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.pl-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
.pl-count { font-family: 'Space Mono', monospace; font-size: 0.6rem; color: var(--muted); }
.pl-empty { text-align: center; padding: 28px 14px; color: var(--muted); font-size: 0.72rem; font-family: 'Space Mono', monospace; line-height: 1.9; }

.pitem { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 7px; margin-bottom: 5px; background: var(--surface2); border: 1px solid transparent; cursor: pointer; transition: all 0.15s; animation: sIn 0.2s ease; }
@keyframes sIn { from{opacity:0;transform:translateX(6px)} to{opacity:1;transform:translateX(0)} }
.pitem:hover { border-color: var(--border); }
.pitem.active { border-color: var(--accent2); background: rgba(232,232,232,0.04); }
.pitem.guest-item { cursor: default; }

.pico { width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.62rem; flex-shrink: 0; font-weight: 700; font-family: 'Space Mono', monospace; }
.pico-yt { background: rgba(255,50,50,.12); color: #ff5555; }
.pico-nu { background: rgba(180,180,180,.1); color: #aaa; }

.pinfo { flex: 1; min-width: 0; }
.ptitle { font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.purl { font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pdel { width: 18px; height: 18px; border-radius: 3px; background: transparent; border: none; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; transition: all 0.15s; flex-shrink: 0; opacity: 0; }
.pitem:hover .pdel { opacity: 1; }
.pdel:hover { background: rgba(255,68,68,.15); color: var(--danger); }

/* ── CLEAR BTN ── */
.clear-btn { background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--muted); cursor: pointer; transition: all 0.15s; }
.clear-btn:hover { border-color: var(--danger); color: var(--danger); }

/* ── TOAST ── */
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 7px; font-family: 'Space Mono', monospace; font-size: 0.68rem; z-index: 1000; transition: all 0.3s; pointer-events: none; white-space: nowrap; }
.toast.err { border-color: var(--danger); color: var(--danger); }
.toast.ok { border-color: var(--accent2); color: var(--accent2); }
.toast.info { border-color: var(--muted); color: var(--muted); }
.toast.gone { opacity: 0; transform: translateX(-50%) translateY(10px); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="logo">Cwel<span>ownia</span></div>
  <div class="logo-sub">// wybierz jak chcesz dołączyć</div>
  <div class="cards">
    <div class="card">
      <div><div class="card-tag">// Admin</div><div class="card-title">Host</div></div>
      <div class="card-desc">Pełna kontrola nad odtwarzaczem i playlistą.</div>
      <div class="fgroup"><div class="flabel">Hasło</div><input class="finput" id="host-pass" type="password" placeholder="hasło hosta"/></div>
      <div class="errmsg" id="host-err"></div>
      <button class="btn" id="host-btn" onclick="loginHost()">Wejdź jako Host →</button>
    </div>
    <div class="card">
      <div><div class="card-tag">// Widz</div><div class="card-title">Gość</div></div>
      <div class="card-desc">Oglądaj i dodawaj filmy do playlisty.</div>
      <div class="fgroup"><div class="flabel">Nick</div><input class="finput" id="guest-name" type="text" placeholder="nick" maxlength="24"/></div>
      <div class="errmsg" id="guest-err"></div>
      <button class="btn" id="guest-btn" onclick="loginGuest()">Wejdź jako Gość →</button>
    </div>
  </div>
</div>

<!-- ROOM -->
<div id="room">
  <header>
    <div class="hlogo">Cwel<span>ownia</span></div>
    <span class="dot"></span>
    <div class="users-row" id="users-row"></div>
    <div class="hbtns" id="host-btns" style="display:none">
      <button class="hbtn" id="btn-pause-lock" onclick="togglePauseLock()">🔓 Kontrola</button>
      <button class="hbtn" id="btn-add-lock" onclick="toggleAddLock()">🔓 Dodawanie</button>
    </div>
    <div class="hbtns">
      <button class="hbtn leave" onclick="leaveRoom()">✕ Wyjdź</button>
    </div>
  </header>

  <div class="main">
    <!-- Player -->
    <div class="player-col">
      <div class="player-wrap" id="player-wrap">
        <div class="placeholder" id="placeholder">
          <div class="ph-icon">▶</div>
          <div class="ph-txt">Dodaj link do playlisty<br>aby zacząć oglądać</div>
        </div>
        <div id="yt-player"></div>
        <div id="native-wrap"><video id="native-vid" playsinline controls></video></div>
        <div id="pause-overlay"><div class="po-icon">⏸</div><div class="po-txt">PAUZA</div></div>
        <div id="ctrl-overlay">
          <div class="prog-row">
            <div class="prog-bg" id="prog-bg">
              <div class="prog-fill" id="prog-fill" style="width:0%"></div>
              <div class="prog-thumb"></div>
            </div>
            <span class="ttime" id="ttime">0:00 / 0:00</span>
          </div>
          <div class="ctrl-row">
            <button class="cb play-btn" id="play-btn" onclick="ctrlPlay()">▶</button>
            <button class="cb" onclick="ctrlSeek(-10)">«10s</button>
            <button class="cb" onclick="ctrlSeek(-5)">«5s</button>
            <button class="cb" onclick="ctrlSeek(5)">5s»</button>
            <button class="cb" onclick="ctrlSeek(10)">10s»</button>
            <div class="vol-wrap">
              <span style="font-size:0.75rem;opacity:0.7">🔊</span>
              <input type="range" class="vol" id="vol-inp" min="0" max="100" value="100" oninput="ctrlVol(this.value)">
            </div>
            <div class="spacer"></div>
            <button class="fs-btn" onclick="ctrlFs()">⛶</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="add-box" id="add-box">
        <div class="slbl">// Dodaj link</div>
        <div class="add-row">
          <input type="text" class="urlinput" id="url-inp" placeholder="link"/>
          <button class="addbtn" onclick="addUrl()">Dodaj</button>
        </div>
        <div class="sup-tags">
          <span class="stag">YouTube</span>
          <span class="stag">i.nuuls</span>
        </div>
      </div>
      <div class="pl-wrap">
        <div class="pl-head">
          <div class="slbl" style="margin:0">// Playlista</div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="pl-count" id="pl-count">0 filmów</span>
            <button class="clear-btn" id="clear-btn" style="display:none" onclick="clearPlaylist()">✕ wyczyść</button>
          </div>
        </div>
        <div id="playlist"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast gone" id="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, get, onValue, update, remove, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const app = initializeApp({
  apiKey: "AIzaSyDT9CdbDWDE15il4ce8tEHmO3Izh1KwSlA",
  authDomain: "cwelownia-watch.firebaseapp.com",
  databaseURL: "https://cwelownia-watch-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cwelownia-watch",
  storageBucket: "cwelownia-watch.firebasestorage.app",
  messagingSenderId: "882490536395",
  appId: "1:882490536395:web:1ab1921e9b17f02044464e"
});
const db = getDatabase(app);

// ── Constants ──
const WORKER_URL = 'https://cwelownia-auth.mozepamietam.workers.dev';
const HOST_NAME = 'MelaPustelnik';

// ── State ──
let isHost = false, myName = '', myUid = null;
let playlist = [], currentIndex = -1;
let pauseLocked = false, addLocked = false;
let unsubRoom = null, unsubUsers = null;
let ytPlayer = null, ytIframe = null, currentPlatform = null;
let ytCurrentTime = 0, ytDuration = 0;
let ignoreState = false, lastSyncedState = null;
let syncDebounce = null, heartbeatTimer = null;

// ── Utils ──
function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast gone', 3000);
}

async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getUid() {
  let uid = sessionStorage.getItem('cwel_uid');
  if (!uid) { uid = Math.random().toString(36).substr(2,10); sessionStorage.setItem('cwel_uid', uid); }
  return uid;
}

// ── Platform ──
function detectPlatform(url) {
  try {
    const h = new URL(url).hostname.replace('www.','');
    if (h.includes('youtube.com') || h.includes('youtu.be')) return 'youtube';
    if (h.includes('i.nuuls.com') || h.includes('nuuls.com')) return 'nuuls';
  } catch(e) {}
  return null;
}

function getYtId(url) {
  const pp = [/youtu\.be\/([^?&#/]+)/, /youtube\.com\/watch\?.*v=([^&#]+)/, /youtube\.com\/shorts\/([^?&#]+)/];
  for (const p of pp) { const m = url.match(p); if (m) return m[1]; }
  return null;
}

function getTitle(url, platform) {
  try {
    if (platform === 'youtube') { const id = getYtId(url); return id ? 'YouTube · ' + id : 'YouTube'; }
    return new URL(url).pathname.split('/').filter(Boolean).pop() || url;
  } catch(e) { return url; }
}

// ── Login ──
window.loginHost = async function() {
  const pass = document.getElementById('host-pass').value;
  const err = document.getElementById('host-err');
  const btn = document.getElementById('host-btn');
  if (!pass) { err.textContent = 'Podaj hasło'; return; }
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Sprawdzam...';
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass, role: 'host' })
    });
    const data = await res.json();
    if (!data.ok) { err.textContent = 'Złe hasło'; btn.disabled = false; btn.textContent = 'Wejdź jako Host →'; return; }
    isHost = true; myName = HOST_NAME;
    myUid = 'host_' + getUid();
    enterRoom();
  } catch(e) {
    err.textContent = 'Błąd połączenia z serwerem';
    btn.disabled = false; btn.textContent = 'Wejdź jako Host →';
  }
};

window.loginGuest = function() {
  const name = document.getElementById('guest-name').value.trim();
  const err = document.getElementById('guest-err');
  if (!name) { err.textContent = 'Podaj nick'; return; }
  if (name.toLowerCase() === HOST_NAME.toLowerCase()) { err.textContent = 'Ta nazwa jest zarezerwowana'; return; }
  localStorage.setItem('cwel_nick', name);
  isHost = false; myName = name;
  myUid = 'guest_' + getUid();
  enterRoom();
};

// ── Enter Room ──
function enterRoom() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('room').style.display = 'flex';

  // Host UI
  document.getElementById('host-btns').style.display = isHost ? 'flex' : 'none';
  document.getElementById('clear-btn').style.display = isHost ? '' : 'none';
  document.getElementById('add-box').style.display = 'block'; // both can add by default

  clearPlayer();
  registerPresence();

  // Subscribe room
  if (unsubRoom) unsubRoom();
  unsubRoom = onValue(ref(db, 'room'), snap => {
    if (!snap.exists()) {
      if (isHost) set(ref(db, 'room'), { playlist: [], currentIndex: -1, playerState: null, pauseLocked: false, addLocked: false });
      return;
    }
    const d = snap.val();
    const newPl = d.playlist ? (Array.isArray(d.playlist) ? d.playlist : Object.values(d.playlist)) : [];
    const newIdx = typeof d.currentIndex === 'number' ? d.currentIndex : -1;
    const newState = d.playerState || null;
    const newPause = !!d.pauseLocked;
    const newAdd = !!d.addLocked;

    // Pause lock changed
    if (newPause !== pauseLocked) {
      pauseLocked = newPause;
      document.getElementById('btn-pause-lock').textContent = pauseLocked ? '🔒 Kontrola' : '🔓 Kontrola';
      document.getElementById('btn-pause-lock').classList.toggle('active', pauseLocked);
    }

    // Add lock changed
    if (newAdd !== addLocked) {
      addLocked = newAdd;
      document.getElementById('btn-add-lock').textContent = addLocked ? '🔒 Dodawanie' : '🔓 Dodawanie';
      document.getElementById('btn-add-lock').classList.toggle('active', addLocked);
      if (!isHost) document.getElementById('add-box').style.display = addLocked ? 'none' : 'block';
    }

    const idxChanged = newIdx !== currentIndex;
    const plChanged = JSON.stringify(newPl) !== JSON.stringify(playlist);
    playlist = newPl;

    if (idxChanged) {
      currentIndex = newIdx;
      renderPlaylist();
      if (currentIndex >= 0 && currentIndex < playlist.length) {
        loadPlayer(playlist[currentIndex]);
        if (!isHost && newState) setTimeout(() => applyState(newState, true), 1600);
      } else {
        clearPlayer();
      }
    } else if (plChanged) {
      renderPlaylist();
    }

    // Sync for guests
    if (!isHost && newState && !idxChanged) {
      const ns = JSON.stringify(newState);
      if (JSON.stringify(lastSyncedState) !== ns) {
        const prev = lastSyncedState ? lastSyncedState.playing : null;
        lastSyncedState = newState;
        applyState(newState, prev !== null && prev !== newState.playing);
      }
    }
  });

  // Subscribe users
  if (unsubUsers) unsubUsers();
  unsubUsers = onValue(ref(db, 'users'), snap => renderUsers(snap.val() || {}));
}

// ── Presence ──
function registerPresence() {
  const uref = ref(db, 'users/' + myUid);
  set(uref, { name: myName, isHost, joinedAt: Date.now() });
  onDisconnect(uref).remove();
  clearInterval(window._presenceTimer);
  window._presenceTimer = setInterval(() => {
    if (myUid) set(uref, { name: myName, isHost, joinedAt: Date.now() }).catch(() => {});
  }, 20000);
}

function renderUsers(users) {
  const row = document.getElementById('users-row');
  row.innerHTML = '';
  const now = Date.now();
  Object.entries(users).forEach(([uid, u]) => {
    if (now - (u.joinedAt || 0) > 45000) { remove(ref(db, 'users/' + uid)).catch(()=>{}); return; }
    const tag = document.createElement('span');
    tag.className = 'utag' + (u.isHost ? ' is-host' : '');
    tag.textContent = (u.isHost ? '👑 ' : '') + u.name;
    row.appendChild(tag);
  });
}

// ── Leave ──
window.leaveRoom = function() {
  if (unsubRoom) { unsubRoom(); unsubRoom = null; }
  if (unsubUsers) { unsubUsers(); unsubUsers = null; }
  clearInterval(window._presenceTimer);
  clearInterval(heartbeatTimer);
  if (myUid) remove(ref(db, 'users/' + myUid));
  clearPlayer();
  isHost = false; myName = ''; myUid = null;
  playlist = []; currentIndex = -1; lastSyncedState = null;
  pauseLocked = false; addLocked = false;
  document.getElementById('room').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('host-pass').value = '';
  document.getElementById('guest-name').value = '';
  document.getElementById('host-err').textContent = '';
  document.getElementById('guest-err').textContent = '';
  document.getElementById('host-btn').disabled = false;
  document.getElementById('host-btn').textContent = 'Wejdź jako Host →';
};

// ── Host controls ──
window.togglePauseLock = async function() {
  if (!isHost) return;
  try { await update(ref(db, 'room'), { pauseLocked: !pauseLocked }); } catch(e) { toast('Błąd', 'err'); }
};

window.toggleAddLock = async function() {
  if (!isHost) return;
  try { await update(ref(db, 'room'), { addLocked: !addLocked }); } catch(e) { toast('Błąd', 'err'); }
};

window.clearPlaylist = async function() {
  if (!isHost) return;
  if (!confirm('Wyczyścić całą playlistę?')) return;
  try { await update(ref(db, 'room'), { playlist: [], currentIndex: -1, playerState: null }); toast('Wyczyszczone ✓', 'ok'); } catch(e) { toast('Błąd', 'err'); }
};

// ── Add URL ──
window.addUrl = async function() {
  if (addLocked && !isHost) { toast('Dodawanie zablokowane przez hosta', 'err'); return; }
  const inp = document.getElementById('url-inp');
  const url = inp.value.trim(); if (!url) return;
  const platform = detectPlatform(url);
  if (!platform) { toast('Tylko YouTube i i.nuuls!', 'err'); return; }
  const item = { url, platform, title: getTitle(url, platform) };
  const newPl = [...playlist, item];
  const newIdx = playlist.length === 0 ? 0 : currentIndex;
  try {
    await update(ref(db, 'room'), { playlist: newPl, currentIndex: newIdx });
    inp.value = ''; toast('Dodano ✓', 'ok');
  } catch(e) { toast('Błąd zapisu', 'err'); }
};

// ── Render Playlist ──
function renderPlaylist() {
  const el = document.getElementById('playlist');
  const n = playlist.length;
  document.getElementById('pl-count').textContent = n + ' ' + (n===1?'film':n<5?'filmy':'filmów');
  if (n === 0) { el.innerHTML = '<div class="pl-empty">// pusto<br>dodaj link powyżej</div>'; return; }
  el.innerHTML = '';
  playlist.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'pitem' + (i === currentIndex ? ' active' : '') + (!isHost ? ' guest-item' : '');
    const ico = item.platform === 'youtube' ? 'pico-yt' : 'pico-nu';
    const lbl = item.platform === 'youtube' ? 'YT' : 'NU';
    div.innerHTML = `
      <div class="pico ${ico}">${lbl}</div>
      <div class="pinfo"><div class="ptitle">${esc(item.title)}</div><div class="purl">${esc(item.url)}</div></div>
      ${isHost ? `<button class="pdel" data-i="${i}">✕</button>` : ''}
    `;
    if (isHost) {
      div.addEventListener('click', () => setIdx(i));
      const del = div.querySelector('.pdel');
      if (del) del.addEventListener('click', e => { e.stopPropagation(); delItem(i); });
    }
    el.appendChild(div);
  });
}

async function setIdx(i) {
  if (!isHost) return;
  try { await update(ref(db, 'room'), { currentIndex: i }); } catch(e) {}
}

async function delItem(i) {
  if (!isHost) return;
  const np = [...playlist]; np.splice(i, 1);
  let ni = currentIndex;
  if (i === currentIndex) ni = np.length > 0 ? Math.min(i, np.length-1) : -1;
  else if (i < currentIndex) ni--;
  try { await update(ref(db, 'room'), { playlist: np, currentIndex: ni }); } catch(e) {}
}

// ── Player State Sync ──
async function pushState(playing, time) {
  if (!isHost && pauseLocked) return;
  clearTimeout(syncDebounce);
  syncDebounce = setTimeout(async () => {
    try {
      await update(ref(db, 'room/playerState'), {
        playing, time: parseFloat((time||0).toFixed(2)),
        updatedAt: Date.now(), itemIndex: currentIndex
      });
    } catch(e) {}
  }, 150);
}

let progressTimer = null;
function startProgressTimer() { clearInterval(progressTimer); progressTimer = setInterval(updateProgress, 500); }
function stopProgressTimer() { clearInterval(progressTimer); progressTimer = null; }

function startHeartbeat() {
  clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(() => {
    if (!isHost && pauseLocked) return;
    let playing = false, time = 0;
    if (currentPlatform === 'youtube' && ytPlayer) {
      try { playing = ytPlayer.getPlayerState() === 1; time = ytPlayer.getCurrentTime() || 0; } catch(e) {}
    } else if (currentPlatform === 'native') {
      const v = document.getElementById('native-vid');
      if (v) { playing = !v.paused; time = v.currentTime || 0; }
    }
    pushState(playing, time);
  }, 3000);
}

function applyState(state, force = false) {
  if (!state) return;
  const { playing, time, updatedAt, itemIndex } = state;
  if (typeof itemIndex === 'number' && itemIndex !== currentIndex) return;
  const lag = (Date.now() - (updatedAt || Date.now())) / 1000;
  const target = (time||0) + (playing ? lag : 0);

  let guestTime = 0;
  if (currentPlatform === 'youtube' && ytPlayer) { try { guestTime = ytPlayer.getCurrentTime()||0; } catch(e) {} }
  else if (currentPlatform === 'native') { const v=document.getElementById('native-vid'); if(v) guestTime=v.currentTime||0; }

  const drift = Math.abs(guestTime - target);
  if (!force && drift <= 3 && playing) return;

  document.getElementById('pause-overlay').classList.toggle('on', !playing);
  document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';

  ignoreState = true;
  if (currentPlatform === 'youtube' && ytPlayer && typeof ytPlayer.seekTo === 'function') {
    try {
      if (force || drift > 3) ytPlayer.seekTo(target, true);
      playing ? ytPlayer.playVideo() : ytPlayer.pauseVideo();
    } catch(e) {}
  } else if (currentPlatform === 'native') {
    const v = document.getElementById('native-vid');
    if (v) {
      if (force || drift > 3) v.currentTime = Math.max(0, target);
      if (playing) v.play().catch(()=>{});
      else v.pause();
    }
  }
  setTimeout(() => { ignoreState = false; }, 600);
}

// ── Clear Player ──
function clearPlayer() {
  clearInterval(heartbeatTimer);
  stopProgressTimer();
  clearInterval(window._ytInfoTimer);
  if (window._ytMsgHandler) { window.removeEventListener('message', window._ytMsgHandler); window._ytMsgHandler = null; }
  currentPlatform = null; ytIframe = null; ytCurrentTime = 0; ytDuration = 0;
  document.getElementById('pause-overlay').classList.remove('on');
  document.getElementById('ctrl-overlay').classList.remove('show');
  document.getElementById('native-wrap').style.display = 'none';
  document.getElementById('native-vid').src = '';
  document.getElementById('placeholder').style.display = 'flex';
  const pf = document.getElementById('prog-fill'); if (pf) pf.style.width = '0%';
  const tt = document.getElementById('ttime'); if (tt) tt.textContent = '0:00 / 0:00';
  const pb = document.getElementById('play-btn'); if (pb) pb.textContent = '▶';
  document.getElementById('yt-player').innerHTML = '';
  if (ytPlayer && typeof ytPlayer.destroy === 'function') {
    try { ytPlayer.destroy(); } catch(e) {}
    ytPlayer = null;
  }
}

// ── Load Player ──
function loadPlayer(item) {
  clearPlayer();
  document.getElementById('placeholder').style.display = 'none';

  if (item.platform === 'youtube') {
    currentPlatform = 'youtube';
    const vid = getYtId(item.url);
    if (!vid) { toast('Błąd ID YouTube','err'); return; }
    const tryCreate = () => {
      if (!window.YT || !window.YT.Player) { setTimeout(tryCreate, 200); return; }
      ytPlayer = new window.YT.Player('yt-player', {
        videoId: vid,
        playerVars: { autoplay: 1, rel: 0, modestbranding: 1, controls: 1, iv_load_policy: 3 },
        events: {
          onReady: e => {
            e.target.playVideo();
            startHeartbeat();
            startProgressTimer();
          },
          onStateChange: e => {
            if (ignoreState) return;
            const playing = e.data === 1;
            const paused = e.data === 2;
            const ended = e.data === 0;
            document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';
            document.getElementById('pause-overlay').classList.toggle('on', paused);
            if (playing || paused) {
              if (!pauseLocked || isHost) {
                pushState(playing, ytPlayer.getCurrentTime()||0);
              } else if (paused && !isHost) {
                setTimeout(() => { try { ytPlayer.playVideo(); } catch(err){} }, 150);
              }
            }
            if (ended && isHost && currentIndex < playlist.length-1) setIdx(currentIndex+1);
          }
        }
      });
    };
    tryCreate();
    document.getElementById('ctrl-overlay').classList.add('show');
    return;
  }

  if (item.platform === 'nuuls') {
    currentPlatform = 'native';
    const nw = document.getElementById('native-wrap');
    nw.style.display = 'flex';
    const v = document.getElementById('native-vid');
    v.src = item.url;
    v.addEventListener('play', () => {
      if (pauseLocked && !isHost) { v.pause(); return; }
      document.getElementById('play-btn').textContent = '⏸';
      document.getElementById('pause-overlay').classList.remove('on');
      if (!ignoreState) pushState(true, v.currentTime);
    });
    v.addEventListener('pause', () => {
      if (pauseLocked && !isHost) return;
      document.getElementById('play-btn').textContent = '▶';
      document.getElementById('pause-overlay').classList.add('on');
      if (!ignoreState) pushState(false, v.currentTime);
    });
    v.addEventListener('timeupdate', updateProgress);
    v.addEventListener('seeked', () => { if (!ignoreState) pushState(!v.paused, v.currentTime); });
    v.addEventListener('ended', () => { if (isHost && currentIndex < playlist.length-1) setIdx(currentIndex+1); });
    v.play().catch(()=>{});
    startHeartbeat();
    startProgressTimer();
    document.getElementById('ctrl-overlay').classList.add('show');
  }
}

// ── Progress & Controls ──
function updateProgress() {
  let ct = 0, dur = 0;
  if (currentPlatform === 'youtube' && ytPlayer) {
    try { ct = ytPlayer.getCurrentTime()||0; dur = ytPlayer.getDuration()||0; } catch(e){}
    const btn = document.getElementById('play-btn');
    try { if (btn) btn.textContent = ytPlayer.getPlayerState()===1 ? '⏸' : '▶'; } catch(e){}
  } else if (currentPlatform === 'native') {
    const v = document.getElementById('native-vid');
    if (v) { ct = v.currentTime||0; dur = v.duration||0; }
  }
  const pct = dur > 0 ? (ct/dur)*100 : 0;
  const pf = document.getElementById('prog-fill');
  const tt = document.getElementById('ttime');
  if (pf) pf.style.width = pct + '%';
  if (tt) tt.textContent = fmt(ct) + ' / ' + fmt(dur);
}

function fmt(s) {
  if (!isFinite(s)||s<0) return '0:00';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

window.ctrlPlay = function() {
  if (currentPlatform === 'youtube' && ytPlayer) {
    try { if (ytPlayer.getPlayerState()===1) ytPlayer.pauseVideo(); else ytPlayer.playVideo(); } catch(e){}
  } else if (currentPlatform === 'native') {
    const v = document.getElementById('native-vid');
    if (v) { if (v.paused) v.play(); else v.pause(); }
  }
};

window.ctrlSeek = function(sec) {
  if (currentPlatform === 'youtube' && ytPlayer) {
    try {
      const t = Math.max(0, (ytPlayer.getCurrentTime()||0) + sec);
      ytPlayer.seekTo(t, true);
      if (isHost) pushState(ytPlayer.getPlayerState()===1, t);
    } catch(e){}
  } else if (currentPlatform === 'native') {
    const v = document.getElementById('native-vid'); if (!v) return;
    v.currentTime = Math.max(0, v.currentTime + sec);
    if (isHost) pushState(!v.paused, v.currentTime);
  }
};

window.ctrlVol = function(val) {
  const v = parseInt(val);
  if (currentPlatform === 'youtube' && ytPlayer) { try { ytPlayer.setVolume(v); } catch(e){} }
  else if (currentPlatform === 'native') {
    const vid = document.getElementById('native-vid'); if (vid) vid.volume = v/100;
  }
};

window.ctrlFs = function() {
  const w = document.getElementById('player-wrap');
  document.fullscreenElement ? document.exitFullscreen() : w.requestFullscreen().catch(()=>{});
};

const progBg = document.getElementById('prog-bg');
let _drag = false;
function _seekFrac(f) {
  const dur = currentPlatform === 'youtube' ? ytDuration : (document.getElementById('native-vid')?.duration||0);
  if (dur <= 0) return;
  const t = f * dur;
  if (currentPlatform === 'youtube' && ytPlayer) {
    try { ytPlayer.seekTo(t, true); if (isHost) pushState(ytPlayer.getPlayerState()===1, t); } catch(e){}
  } else if (currentPlatform === 'native') {
    const v = document.getElementById('native-vid'); if (v) { v.currentTime = t; if (isHost) pushState(!v.paused, t); }
  }
}
progBg.addEventListener('mousedown', e => { _drag=true; const r=progBg.getBoundingClientRect(); _seekFrac(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))); });
document.addEventListener('mousemove', e => { if(!_drag)return; const r=progBg.getBoundingClientRect(); _seekFrac(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))); });
document.addEventListener('mouseup', ()=>{ _drag=false; });

// ── Keyboard ──
document.getElementById('url-inp').addEventListener('keydown', e => { if(e.key==='Enter') window.addUrl(); });
document.getElementById('host-pass').addEventListener('keydown', e => { if(e.key==='Enter') window.loginHost(); });
document.getElementById('guest-name').addEventListener('keydown', e => { if(e.key==='Enter') window.loginGuest(); });


// ── Init ──
window.addEventListener('load', () => {
  const saved = localStorage.getItem('cwel_nick');
  if (saved) document.getElementById('guest-name').value = saved;
});
</script>
